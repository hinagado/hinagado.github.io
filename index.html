<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>ひなが堂</title>
<meta name="description" content="くらしと仕事を少しラクにする「ひな形」と、ちょっと楽しいデジタルの小物の店。">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  :root { --ai:#24466B; --shu:#D9573A; --kinari:#F6EFE2; --ink:#3C3832; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--kinari); color:var(--ink); font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif; }
  main { padding:32px 16px; text-align:center; }
  img { width:120px; height:120px; border-radius:28px; }
  h1 { color:var(--ai); font-size:36px; margin:16px 0 8px; }
  p { font-size:17px; line-height:1.8; }
  .shu { color:var(--shu); font-weight:bold; }
</style>
</head>
<body>
<main>
  <img src="apple-touch-icon.png" alt="ひなが堂のおもち">
  <h1>ひなが堂</h1>
  <p class="shu">くらしと仕事を、少しラクにする「ひな形」</p>
  <p>ただいま開店の準備中です。</p>
</main>
</body>
</html>
