<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>お店のチラシ欄・見本</title>
  <style>
    :root { font-family: "BIZ UDPGothic", "BIZ UDゴシック", "Noto Sans JP", system-ui, sans-serif; color: #202124; background: #f4f6f2; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(1120px, calc(100% - 28px)); margin: 36px auto; }
    .flyers { padding: clamp(20px, 5vw, 46px); border-radius: 22px; background: #fff; box-shadow: 0 4px 22px rgba(23, 79, 53, .1); }
    h2 { margin: 0 0 8px; color: #174f35; font-size: clamp(27px, 5vw, 40px); }
    .intro { margin: 0 0 24px; color: #59635e; }
    [data-flyers] { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 22px; }
    .flyer-card { overflow: hidden; border: 1px solid #d7ded9; border-radius: 16px; background: #fff; }
    .flyer-image { display: block; width: 100%; aspect-ratio: 4 / 5; background: #edf1ed; object-fit: cover; }
    .flyer-text { padding: 16px; }
    .flyer-shop { margin: 0; color: #176b45; font-weight: 800; }
    .flyer-title { margin: 4px 0 8px; font-size: 21px; }
    .flyer-period { margin: 0 0 14px; color: #59635e; }
    .flyer-open { display: inline-block; padding: 10px 18px; border-radius: 9px; background: #176b45; color: #fff; font-weight: 800; text-decoration: none; }
    .flyer-open:focus, .flyer-open:hover { background: #0f5032; outline: 3px solid #b9e5cd; outline-offset: 2px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body data-posts-src="" data-flyers-demo="1">
<main>
  <section class="flyers" hidden>
    <h2>お店のチラシ</h2>
    <p class="intro">いま見られる、お店からのお知らせです。</p>
    <div data-flyers></div>
  </section>
</main>
<script src="flyer_view.js"></script>
</body>
</html>
